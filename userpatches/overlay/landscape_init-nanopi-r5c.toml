version = "0.24.2"

[[ifaces]]
name = "wan"
create_dev_type = "no_need_to_create"
zone_type = "wan"
enable_in_boot = true
wifi_mode = "undefined"

[[ifaces]]
name = "lan"
create_dev_type = "no_need_to_create"
zone_type = "lan"
enable_in_boot = true
wifi_mode = "undefined"

[[ipconfigs]]
iface_name = "wan"
enable = true

[ipconfigs.ip_model]
t = "dhcpclient"
default_router = true
custome_opts = []

[[nats]]
iface_name = "wan"
enable = true

[nats.nat_config.tcp_range]
start = 32768
end = 65535

[nats.nat_config.udp_range]
start = 32768
end = 65535

[nats.nat_config.icmp_in_range]
start = 32768
end = 65535

[[dhcpv4_services]]
iface_name = "lan"
enable = true

[dhcpv4_services.config]
ip_range_start = "100.150.1.2"
server_ip_addr = "100.150.1.10"
network_mask = 24
address_lease_time = 43200
custom_options = []

[[route_lans]]
iface_name = "lan"
enable = true

[[route_wans]]
iface_name = "wan"
enable = true
