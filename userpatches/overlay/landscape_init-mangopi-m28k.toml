version = "0.24.2"

[[ifaces]]
name = "eth0"
create_dev_type = "no_need_to_create"
zone_type = "wan"
enable_in_boot = true
wifi_mode = "undefined"

[[ifaces]]
name = "eth1"
create_dev_type = "no_need_to_create"
controller_name = "br_lan"
zone_type = "undefined"
enable_in_boot = true
wifi_mode = "undefined"

[[ifaces]]
name = "wlan0"
create_dev_type = "no_need_to_create"
controller_name = "br_lan"
zone_type = "undefined"
enable_in_boot = true
wifi_mode = "ap"

[[ifaces]]
name = "br_lan"
create_dev_type = "bridge"
zone_type = "lan"
enable_in_boot = true
wifi_mode = "undefined"

[[ipconfigs]]
iface_name = "eth0"
enable = true

[ipconfigs.ip_model]
t = "dhcpclient"
default_router = true
custome_opts = []

[[nats]]
iface_name = "eth0"
enable = true

[nats.nat_config.tcp_range]
start = 32768
end = 65535

[nats.nat_config.udp_range]
start = 32768
end = 65535

[nats.nat_config.icmp_in_range]
start = 32768
end = 65535

[[wifi_configs]]
iface_name = "wlan0"
enable = true
config = """
# 基本接口配置
interface=wlan0
driver=nl80211

# WiFi 6核心设置
hw_mode=a
ieee80211n=1
ieee80211ac=1
ieee80211ax=1
wmm_enabled=1

# 网络标识
ssid=Landscape-test
country_code=CN

# 5GHz频段配置
channel=36
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]

# 使用基础VHT配置
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=0

# 安全认证
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=landscapetest

# 简化HE配置
he_oper_chwidth=0
he_su_beamformer=1
"""

[[dhcpv4_services]]
iface_name = "br_lan"
enable = true

[dhcpv4_services.config]
ip_range_start = "100.150.1.2"
server_ip_addr = "100.150.1.10"
network_mask = 24
address_lease_time = 43200
custom_options = []

[[route_lans]]
iface_name = "br_lan"
enable = true

[[route_wans]]
iface_name = "eth0"
enable = true
